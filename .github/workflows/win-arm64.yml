# Windows arm64 CI – cross-build on Linux, run hello.exe/trap.exe on Windows arm64.
# Caches: llvm-mingw (release), FPC cross-build + ppca64 (source hash), msgtxt.inc (msg hash). See docs/ci-arm64-plan.md.
#
# Cache invalidation: if you change something that affects a build output, update that cache's key.
# - llvm-mingw: key = LLVM_MINGW_RELEASE (+ runner). Change env.LLVM_MINGW_RELEASE to force re-download.
# - FPC cross-build: key = hash(...)-v2 (bump -v2 to force miss if cache was saved without ppca64). Add any new dir/file that affects crossinstall or ppca64.
# - msgtxt: key = hash(compiler/msg/error*.msg). Add any msg file that feeds msg2inc.

name: Windows arm64

on:
  push:
    branches: [ develop, feature/win-aarch64, main ]
  pull_request:
    branches: [ develop, feature/win-aarch64, main ]
  workflow_dispatch:  # Run manually from Actions tab → "Windows arm64" → "Run workflow"

env:
  FPC_VERSION: "3.3.1"
  LLVM_MINGW_RELEASE: "20251216"
  LLVM_MINGW_ARCHIVE: "llvm-mingw-20251216-ucrt-ubuntu-22.04-x86_64.tar.xz"

jobs:
  crossbuild:
    name: Cross-build (Linux → aarch64-win64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and host FPC
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fpc
          which make
          make -v
          fpc -iV
          echo "PATH=$PATH"

      - name: Cache llvm-mingw
        id: cache_llvm
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm-mingw
          key: llvm-mingw-${{ env.LLVM_MINGW_RELEASE }}-ubuntu-22.04

      - name: Set llvm-mingw env
        run: |
          echo "LLVM_MINGW=$RUNNER_TEMP/llvm-mingw" >> $GITHUB_ENV
          echo "$RUNNER_TEMP/llvm-mingw/bin" >> $GITHUB_PATH

      - name: Install llvm-mingw
        if: steps.cache_llvm.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          curl -sL "https://github.com/mstorsjo/llvm-mingw/releases/download/${{ env.LLVM_MINGW_RELEASE }}/${{ env.LLVM_MINGW_ARCHIVE }}" -o "$RUNNER_TEMP/llvm-mingw.tar.xz"
          tar -xf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          "$RUNNER_TEMP/llvm-mingw/bin/aarch64-w64-mingw32-clang" --version

      # Cache key: bump -v3 to force a clean rebuild (avoids stale/partial caches).
      - name: Cache FPC cross-build (ppcrossa64 + aarch64-win64 units + ppca64)
        id: cache_fpc
        uses: actions/cache@v4
        with:
          path: |
            compiler/ppcrossa64
            compiler/ppca64
            ${{ runner.temp }}/fpc_install
          key: fpc-aarch64-win64-${{ runner.os }}-${{ hashFiles('compiler/**', 'rtl/**', 'packages/**', 'Makefile', 'Makefile.fpc') }}-v3

      - name: Verify FPC cache contents (when cache hit)
        if: steps.cache_fpc.outputs.cache-hit == 'true'
        run: |
          missing=""
          [ -f "$GITHUB_WORKSPACE/compiler/ppcrossa64" ] || missing="$missing compiler/ppcrossa64"
          [ -f "$GITHUB_WORKSPACE/compiler/ppca64" ] || missing="$missing compiler/ppca64"
          [ -d "$RUNNER_TEMP/fpc_install/lib/fpc/${{ env.FPC_VERSION }}/units/aarch64-win64" ] || missing="$missing fpc_install/.../units/aarch64-win64"
          if [ -n "$missing" ]; then
            echo "::error::FPC cache incomplete (missing:$missing). Bump cache key suffix (-v3 -> -v4) in the workflow to force a fresh build."
            exit 1
          fi
          echo "FPC cache OK: ppcrossa64, ppca64, fpc_install present."

      - name: Cross-install FPC aarch64-win64
        if: steps.cache_fpc.outputs.cache-hit != 'true'
        run: |
          which make || true
          make crossinstall -j4 \
            CPU_TARGET=aarch64 \
            OS_TARGET=win64 \
            FPC=/usr/bin/fpc \
            BINUTILSPREFIX=aarch64-w64-mingw32- \
            CROSSOPT="-FD$RUNNER_TEMP/llvm-mingw/bin" \
            INSTALL_PREFIX="$RUNNER_TEMP/fpc_install"
        env:
          PATH: "/usr/bin:/usr/local/bin:$RUNNER_TEMP/llvm-mingw/bin:$PATH"

      # After crossinstall, ppcrossa64 lives in fpc_install/bin/; copy to compiler/ so Phase 2 compile finds it.
      - name: Ensure ppcrossa64 at compiler/ for Phase 2 compile
        if: steps.cache_fpc.outputs.cache-hit != 'true'
        run: |
          D="$GITHUB_WORKSPACE"
          INST="$RUNNER_TEMP/fpc_install"
          if [ -f "$INST/bin/ppcrossa64" ] && [ ! -f "$D/compiler/ppcrossa64" ]; then
            cp "$INST/bin/ppcrossa64" "$D/compiler/ppcrossa64"
            chmod +x "$D/compiler/ppcrossa64"
            echo "Copied ppcrossa64 from fpc_install/bin to compiler/"
          fi
          for cand in "$D/compiler/ppcrossa64" "$INST/bin/ppcrossa64"; do
            if [ -f "$cand" ]; then echo "ppcrossa64 at: $cand"; break; fi
          done

      - name: Compile Phase 2 tests
        run: |
          set -e
          D="$GITHUB_WORKSPACE"
          UP="$RUNNER_TEMP/fpc_install/lib/fpc/${{ env.FPC_VERSION }}/units/aarch64-win64"
          if [ -f "$D/compiler/ppcrossa64" ]; then
            PPC="$D/compiler/ppcrossa64"
          elif [ -f "$RUNNER_TEMP/fpc_install/bin/ppcrossa64" ]; then
            PPC="$RUNNER_TEMP/fpc_install/bin/ppcrossa64"
          else
            echo "::error::ppcrossa64 not found in compiler/ or fpc_install/bin/"
            exit 1
          fi
          export PATH="$RUNNER_TEMP/llvm-mingw/bin:$PATH"
          "$PPC" -Twin64 -XPaarch64-w64-mingw32- \
            -Fu"$UP/rtl" -Fu"$UP/rtl-objpas" \
            -FE"$GITHUB_WORKSPACE/docs/phase2-tests" \
            -FD"$RUNNER_TEMP/llvm-mingw/bin" \
            -o"$GITHUB_WORKSPACE/docs/phase2-tests/hello.exe" \
            docs/phase2-tests/hello.pas
          "$PPC" -Twin64 -XPaarch64-w64-mingw32- \
            -Fu"$UP/rtl" -Fu"$UP/rtl-objpas" \
            -FE"$GITHUB_WORKSPACE/docs/phase2-tests" \
            -FD"$RUNNER_TEMP/llvm-mingw/bin" \
            -o"$GITHUB_WORKSPACE/docs/phase2-tests/trap.exe" \
            docs/phase2-tests/trap.pas
          "$PPC" -Twin64 -XPaarch64-w64-mingw32- \
            -Fu"$UP/rtl" -Fu"$UP/rtl-objpas" \
            -FE"$GITHUB_WORKSPACE/docs/phase2-tests" \
            -FD"$RUNNER_TEMP/llvm-mingw/bin" \
            -o"$GITHUB_WORKSPACE/docs/phase2-tests/arm64trap.exe" \
            docs/phase2-tests/arm64trap.pas
          if [ -f docs/phase2-tests/neontest.pas ]; then
            "$PPC" -Twin64 -XPaarch64-w64-mingw32- \
              -Fu"$UP/rtl" -Fu"$UP/rtl-objpas" \
              -FE"$GITHUB_WORKSPACE/docs/phase2-tests" \
              -FD"$RUNNER_TEMP/llvm-mingw/bin" \
              -o"$GITHUB_WORKSPACE/docs/phase2-tests/neontest.exe" \
              docs/phase2-tests/neontest.pas
          else
            echo "neontest.pas not in repo, skipping NEON compile"
          fi

      - name: Cache msgtxt.inc / msgidx.inc (host-generated, skip rebuild when msg files unchanged)
        id: cache_msgtxt
        uses: actions/cache@v4
        with:
          path: |
            compiler/msgtxt.inc
            compiler/msgidx.inc
          key: msgtxt-${{ runner.os }}-${{ hashFiles('compiler/msg/error*.msg') }}

      - name: Report cache status (llvm-mingw, FPC cross-build, msgtxt)
        run: |
          echo "cache_llvm=${{ steps.cache_llvm.outputs.cache-hit }}"
          echo "cache_fpc=${{ steps.cache_fpc.outputs.cache-hit }}"
          echo "cache_msgtxt=${{ steps.cache_msgtxt.outputs.cache-hit }}"
          echo "Cache hits above = skip download/build for those steps."

      # When building ppca64 (FPC cache miss), we must have msgtxt.inc. Relying on
      # msgtxt cache restore can still lead to make trying to build/run msg2inc.exe.
      # So always generate with host FPC whenever we will run "Build native ppca64".
      - name: Generate msgtxt.inc with host FPC (Phase 3)
        if: steps.cache_fpc.outputs.cache-hit != 'true'
        run: |
          # msg2inc must run on the runner (Linux); make compiler uses FPC=ppcrossa64
          # which would build a Windows msg2inc.exe and then try to run it -> fail.
          # Pre-generate msgtxt.inc with host fpc so "make compiler" skips msg2inc.
          make -C compiler msgtxt.inc FPC=/usr/bin/fpc
        env:
          PATH: "/usr/bin:/usr/local/bin:$PATH"

      - name: Build native ppca64 (Phase 3)
        if: steps.cache_fpc.outputs.cache-hit != 'true'
        run: |
          D="$GITHUB_WORKSPACE"
          UP="$RUNNER_TEMP/fpc_install/lib/fpc/${{ env.FPC_VERSION }}/units/aarch64-win64"
          make -C compiler compiler -j4 \
            FPC="$D/compiler/ppcrossa64" \
            OS_TARGET=win64 \
            CPU_TARGET=aarch64 \
            BINUTILSPREFIX=aarch64-w64-mingw32- \
            OPT="-FD$RUNNER_TEMP/llvm-mingw/bin -Fu$UP/rtl -Fu$UP/rtl-objpas"
          # Ensure canonical location for cache and staging (make may put it in compiler/ or aarch64/bin/...)
          for cand in "$D/compiler/ppca64" "$D/compiler/aarch64/bin/aarch64-win64/ppca64" "$D/ppca64"; do
            if [ -f "$cand" ]; then
              if [ "$cand" != "$D/compiler/ppca64" ]; then cp "$cand" "$D/compiler/ppca64"; fi
              break
            fi
          done
        env:
          PATH: "/usr/bin:/usr/local/bin:$RUNNER_TEMP/llvm-mingw/bin:$PATH"

      # Paths: compile writes to $GITHUB_WORKSPACE/docs/phase2-tests/{hello,trap,arm64trap,neontest}.exe;
      # ppca64 is at $GITHUB_WORKSPACE/compiler/ppca64 (or compiler/aarch64/bin/aarch64-win64/).
      # We stage into arm64-exes/ and upload that dir; download extracts to workspace.
      - name: List expected exe locations (diagnostic)
        run: |
          D="$GITHUB_WORKSPACE"
          echo "=== docs/phase2-tests ==="
          ls -la "$D/docs/phase2-tests/" || true
          echo "=== compiler (ppca64, ppcrossa64) ==="
          ls -la "$D/compiler/ppca64" 2>/dev/null || echo "compiler/ppca64 not found"
          ls -la "$D/compiler/ppcrossa64" 2>/dev/null || echo "compiler/ppcrossa64 not found"
          find "$D/compiler" -maxdepth 4 -name 'ppca64*' -o -name 'ppcrossa64*' 2>/dev/null || true

      - name: Stage and upload arm64 executables and ppca64
        run: |
          set -e
          D="$GITHUB_WORKSPACE"
          STAGE="$D/arm64-exes"
          mkdir -p "$STAGE"
          # Phase 2 test exes (compile writes to docs/phase2-tests/)
          for f in hello trap; do
            if [ -f "$D/docs/phase2-tests/${f}.exe" ]; then cp "$D/docs/phase2-tests/${f}.exe" "$STAGE/"; else echo "Missing: docs/phase2-tests/${f}.exe"; exit 1; fi
          done
          if [ -f "$D/docs/phase2-tests/arm64trap.exe" ]; then
            cp "$D/docs/phase2-tests/arm64trap.exe" "$STAGE/"
          elif [ -f "$D/docs/phase2-tests/arm64trap" ]; then
            cp "$D/docs/phase2-tests/arm64trap" "$STAGE/arm64trap.exe"
          else
            echo "Missing: arm64trap (expected docs/phase2-tests/arm64trap.exe or arm64trap)"
            ls -la "$D/docs/phase2-tests/"
            exit 1
          fi
          if [ -f "$D/docs/phase2-tests/neontest.exe" ]; then
            cp "$D/docs/phase2-tests/neontest.exe" "$STAGE/"
          elif [ -f "$D/docs/phase2-tests/neontest" ]; then
            cp "$D/docs/phase2-tests/neontest" "$STAGE/neontest.exe"
          else
            echo "neontest.exe not built (neontest.pas optional), skipping"
          fi
          # ppca64: make can put it in compiler/, compiler/aarch64/bin/aarch64-win64/, or repo root
          PPC64=""
          for cand in "$D/compiler/ppca64" "$D/compiler/ppca64.exe" \
                      "$D/compiler/aarch64/bin/aarch64-win64/ppca64" \
                      "$D/compiler/aarch64/bin/aarch64-win64/ppca64.exe" \
                      "$D/ppca64" "$D/ppca64.exe"; do
            if [ -f "$cand" ]; then PPC64="$cand"; break; fi
          done
          if [ -z "$PPC64" ]; then
            echo "Missing: ppca64 (searched compiler/, aarch64/bin/aarch64-win64/, repo root)"
            find "$D" -maxdepth 5 -name 'ppca64*' 2>/dev/null || true
            exit 1
          fi
          cp "$PPC64" "$STAGE/ppca64"
          echo "Staged in $STAGE:"; ls -la "$STAGE/"

      - name: Upload arm64 executables and ppca64
        uses: actions/upload-artifact@v4
        with:
          name: phase2-arm64-exes
          path: arm64-exes

  test-windows-arm64:
    name: Run on Windows arm64
    runs-on: windows-11-arm
    needs: [ crossbuild ]
    steps:
      - uses: actions/checkout@v4

      # Artifact "phase2-arm64-exes" is the arm64-exes/ dir; download extracts to workspace.
      - name: Download arm64 executables
        uses: actions/download-artifact@v4
        with:
          name: phase2-arm64-exes
          path: ${{ github.workspace }}

      - name: List artifact contents (sanity check)
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $dir = if (Test-Path arm64-exes) { 'arm64-exes' } else { '.' }
          Write-Host "Artifact contents ($dir):"
          Get-ChildItem $dir -ErrorAction SilentlyContinue | Format-Table Name, Length -AutoSize
        shell: pwsh

      - name: Run hello.exe and trap.exe
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $dir = if (Test-Path arm64-exes\hello.exe) { 'arm64-exes' } else { '.' }
          Push-Location $dir
          .\hello.exe
          $out = .\trap.exe 2>&1 | Out-String
          Pop-Location
          if ($out -notmatch 'Caught: The Unwind Trap') {
            Write-Error "Expected 'Caught: The Unwind Trap'. Got: $out"
            exit 1
          }
          Write-Host "OK: $out"
          exit 0
        shell: pwsh

      # Golden proof for bounty: verify trap.exe has valid ARM64 SEH unwind tables (.pdata).
      - name: Verify SEH unwind tables (dumpbin /pdata)
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $dir = if (Test-Path arm64-exes\trap.exe) { 'arm64-exes' } else { '.' }
          $trapExe = Join-Path $dir 'trap.exe'
          if (-not (Test-Path $trapExe)) { Write-Host "trap.exe not found, skipping dumpbin"; exit 0 }
          $dumpbin = $null
          if (Get-Command dumpbin -ErrorAction SilentlyContinue) { $dumpbin = 'dumpbin' }
          if (-not $dumpbin -and (Test-Path "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe")) {
            $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
            if ($vsPath) {
              $candidates = Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" -Recurse -Filter "dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($candidates) { $dumpbin = $candidates.FullName }
            }
          }
          if (-not $dumpbin) {
            Write-Host "::warning::dumpbin not found; SEH unwind check skipped (install MSVC Build Tools for full check)"
            exit 0
          }
          $out = & $dumpbin /pdata $trapExe 2>&1
          $text = $out | Out-String
          if ($text -match 'Unwind|pdata|exception') {
            Write-Host "Verified: trap.exe contains ARM64 unwind/exception metadata."
          } else {
            Write-Host "dumpbin /pdata output (first 50 lines):"
            ($text -split "`n" | Select-Object -First 50) -join "`n"
            Write-Host "::warning::No obvious unwind pattern in dumpbin output; binary may still be valid."
          }
          exit 0
        shell: pwsh

      - name: Run NEON vector test (SIMD performance validation)
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $dir = if (Test-Path arm64-exes\neontest.exe) { 'arm64-exes' } else { '.' }
          $exe = Join-Path $dir 'neontest.exe'
          if (-not (Test-Path $exe)) {
            Write-Host "neontest.exe not in artifact (neontest.pas optional), skipping NEON test"
            exit 0
          }
          Push-Location $dir
          $out = .\neontest.exe 2>&1 | Out-String
          Pop-Location
          Write-Host $out
          if ($out -notmatch 'Result: PASS \(SIMD alignment and execution successful\)') {
            Write-Error "NEON test failed: expected 'Result: PASS (SIMD alignment and execution successful)'. Got: $out"
            exit 1
          }
          Write-Host "NEON vector test passed."
          exit 0
        shell: pwsh

      - name: Verify ppca64 (Phase 3 native compiler)
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $dir = if (Test-Path arm64-exes\ppca64) { 'arm64-exes' } elseif (Test-Path arm64-exes\ppca64.exe) { 'arm64-exes' } else { '.' }
          Write-Host "Looking for ppca64 in: $dir"; Get-ChildItem $dir -ErrorAction SilentlyContinue
          $ppc = $null
          foreach ($cand in @("$dir\ppca64.exe", "$dir\ppca64", 'arm64-exes\ppca64.exe', 'arm64-exes\ppca64', 'compiler\ppca64.exe', 'compiler\ppca64', 'ppca64.exe', 'ppca64')) {
            if (Test-Path $cand) { $ppc = (Resolve-Path $cand).Path; break }
          }
          if (-not $ppc) { Write-Error 'ppca64 not found'; exit 1 }
          Write-Host "Running: $ppc -iV"
          $ver = & $ppc '-iV' 2>&1
          $exitCode = $LASTEXITCODE
          Write-Host "ppca64 -iV: $ver"
          if ($exitCode -ne 0 -or -not $ver) {
            Write-Error "ppca64 -iV failed (exit $exitCode): $ver"
            exit 1
          }
          exit 0
        shell: pwsh

      # Bounty Boss last: try...finally + exit (strictest SEH/local unwind). Run after all other checks.
      - name: Run Bounty Boss test (try...finally + exit)
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $dir = if (Test-Path arm64-exes\arm64trap.exe) { 'arm64-exes' } else { '.' }
          Push-Location $dir
          $out = .\arm64trap.exe 2>&1 | Out-String
          Pop-Location
          Write-Host $out
          if ($out -notmatch 'Success: Finally block executed!') {
            Write-Error "Bounty Boss failed: expected 'Success: Finally block executed!'. Got: $out"
            exit 1
          }
          if ($out -notmatch 'Done\.') {
            Write-Error "Bounty Boss failed: expected 'Done.'. Got: $out"
            exit 1
          }
          Write-Host "Bounty Boss test passed."
          exit 0
        shell: pwsh
