# Windows arm64 CI – cross-build on Linux, run hello.exe/trap.exe on Windows arm64.
# Caches: llvm-mingw (by release), FPC cross-build (by compiler/rtl/packages hash). See docs/ci-arm64-plan.md.

name: Windows arm64

on:
  push:
    branches: [ develop, feature/win-aarch64, main ]
  pull_request:
    branches: [ develop, feature/win-aarch64, main ]
  workflow_dispatch:  # Run manually from Actions tab → "Windows arm64" → "Run workflow"

env:
  FPC_VERSION: "3.3.1"
  LLVM_MINGW_RELEASE: "20251216"
  LLVM_MINGW_ARCHIVE: "llvm-mingw-20251216-ucrt-ubuntu-22.04-x86_64.tar.xz"

jobs:
  crossbuild:
    name: Cross-build (Linux → aarch64-win64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and host FPC
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fpc
          which make
          make -v
          fpc -iV
          echo "PATH=$PATH"

      - name: Cache llvm-mingw
        id: cache_llvm
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm-mingw
          key: llvm-mingw-${{ env.LLVM_MINGW_RELEASE }}-ubuntu-22.04

      - name: Set llvm-mingw env
        run: |
          echo "LLVM_MINGW=$RUNNER_TEMP/llvm-mingw" >> $GITHUB_ENV
          echo "$RUNNER_TEMP/llvm-mingw/bin" >> $GITHUB_PATH

      - name: Install llvm-mingw
        if: steps.cache_llvm.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          curl -sL "https://github.com/mstorsjo/llvm-mingw/releases/download/${{ env.LLVM_MINGW_RELEASE }}/${{ env.LLVM_MINGW_ARCHIVE }}" -o "$RUNNER_TEMP/llvm-mingw.tar.xz"
          tar -xf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          "$RUNNER_TEMP/llvm-mingw/bin/aarch64-w64-mingw32-clang" --version

      - name: Cache FPC cross-build (ppcrossa64 + aarch64-win64 units)
        id: cache_fpc
        uses: actions/cache@v4
        with:
          path: |
            compiler/ppcrossa64
            ${{ runner.temp }}/fpc_install
          key: fpc-aarch64-win64-${{ runner.os }}-${{ hashFiles('compiler/**', 'rtl/**', 'packages/**', 'Makefile', 'Makefile.fpc') }}

      - name: Cross-install FPC aarch64-win64
        if: steps.cache_fpc.outputs.cache-hit != 'true'
        run: |
          which make || true
          make crossinstall -j4 \
            CPU_TARGET=aarch64 \
            OS_TARGET=win64 \
            FPC=/usr/bin/fpc \
            BINUTILSPREFIX=aarch64-w64-mingw32- \
            CROSSOPT="-FD$RUNNER_TEMP/llvm-mingw/bin" \
            INSTALL_PREFIX="$RUNNER_TEMP/fpc_install"
        env:
          PATH: "/usr/bin:/usr/local/bin:$RUNNER_TEMP/llvm-mingw/bin:$PATH"

      - name: Compile Phase 2 tests
        run: |
          PPC="$GITHUB_WORKSPACE/compiler/ppcrossa64"
          UP="$RUNNER_TEMP/fpc_install/lib/fpc/${{ env.FPC_VERSION }}/units/aarch64-win64"
          export PATH="$RUNNER_TEMP/llvm-mingw/bin:$PATH"
          "$PPC" -Twin64 -XPaarch64-w64-mingw32- \
            -Fu"$UP/rtl" -Fu"$UP/rtl-objpas" \
            -FE"$GITHUB_WORKSPACE/docs/phase2-tests" \
            -FD"$RUNNER_TEMP/llvm-mingw/bin" \
            -o"$GITHUB_WORKSPACE/docs/phase2-tests/hello.exe" \
            docs/phase2-tests/hello.pas
          "$PPC" -Twin64 -XPaarch64-w64-mingw32- \
            -Fu"$UP/rtl" -Fu"$UP/rtl-objpas" \
            -FE"$GITHUB_WORKSPACE/docs/phase2-tests" \
            -FD"$RUNNER_TEMP/llvm-mingw/bin" \
            -o"$GITHUB_WORKSPACE/docs/phase2-tests/trap.exe" \
            docs/phase2-tests/trap.pas

      - name: Generate msgtxt.inc with host FPC (Phase 3)
        run: |
          # msg2inc must run on the runner (Linux); make compiler uses FPC=ppcrossa64
          # which would build a Windows msg2inc.exe and then try to run it -> fail.
          # Pre-generate msgtxt.inc with host fpc so "make compiler" skips msg2inc.
          make -C compiler msgtxt.inc FPC=/usr/bin/fpc
        env:
          PATH: "/usr/bin:/usr/local/bin:$PATH"

      - name: Build native ppca64 (Phase 3)
        run: |
          UP="$RUNNER_TEMP/fpc_install/lib/fpc/${{ env.FPC_VERSION }}/units/aarch64-win64"
          make -C compiler compiler -j4 \
            FPC="$GITHUB_WORKSPACE/compiler/ppcrossa64" \
            OS_TARGET=win64 \
            CPU_TARGET=aarch64 \
            BINUTILSPREFIX=aarch64-w64-mingw32- \
            OPT="-FD$RUNNER_TEMP/llvm-mingw/bin -Fu$UP/rtl -Fu$UP/rtl-objpas"
        env:
          PATH: "/usr/bin:/usr/local/bin:$RUNNER_TEMP/llvm-mingw/bin:$PATH"

      - name: Upload arm64 executables and ppca64
        uses: actions/upload-artifact@v4
        with:
          name: phase2-arm64-exes
          path: |
            docs/phase2-tests/hello.exe
            docs/phase2-tests/trap.exe
            compiler/ppca64

  test-windows-arm64:
    name: Run on Windows arm64
    runs-on: windows-11-arm
    needs: [ crossbuild ]
    steps:
      - uses: actions/checkout@v4

      - name: Download arm64 executables
        uses: actions/download-artifact@v4
        with:
          name: phase2-arm64-exes

      - name: Run hello.exe and trap.exe
        run: |
          $dir = if (Test-Path hello.exe) { '.' } else { 'docs\phase2-tests' }
          Push-Location $dir
          .\hello.exe
          $out = .\trap.exe 2>&1 | Out-String
          Pop-Location
          if ($out -notmatch 'Caught: The Unwind Trap') {
            Write-Error "Expected 'Caught: The Unwind Trap'. Got: $out"
            exit 1
          }
          Write-Host "OK: $out"
          exit 0
        shell: pwsh

      - name: Verify ppca64 (Phase 3 native compiler)
        run: |
          $ppc = if (Test-Path compiler\ppca64) { 'compiler\ppca64' } else { 'ppca64' }
          $ver = & $ppc -iV 2>&1 | Out-String
          Write-Host "ppca64 -iV: $ver"
          if (-not $ver -or $LASTEXITCODE -ne 0) {
            Write-Error "ppca64 -iV failed: $ver"
            exit 1
          }
          exit 0
        shell: pwsh
