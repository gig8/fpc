# Windows arm64 CI – cross-build on Linux, run hello.exe/trap.exe on Windows arm64.
# Caches: llvm-mingw (release), FPC cross-build + ppca64 (source hash), msgtxt.inc (msg hash). See Vault Projects/fpc/ci-arm64-plan.md.
#
# Cache invalidation: if you change something that affects a build output, update that cache's key.
# - llvm-mingw: key = LLVM_MINGW_RELEASE (+ runner). Change env.LLVM_MINGW_RELEASE to force re-download.
# - FPC cross-build: key = hash(...)-vN. Bump -vN to force a fresh build when cache is incomplete (see below).
# - msgtxt: key = hash(compiler/msg/error*.msg). Add any msg file that feeds msg2inc.
#
# FPC cache: we use actions/cache/restore (restore only) and actions/cache/save with if: success()
# (save only when job succeeds). So we never persist incomplete cache; no more "bump key when incomplete".
# Bump -vN when you change something that affects build output (e.g. add a cache path).
# Output for Windows: we stage the native compiler as ppca64.exe in the artifact so the Windows job
# runs ppca64.exe -iV (reliable output/exit code); make produces "ppca64" (no extension), we copy to STAGE/ppca64.exe.

name: Windows arm64

on:
  push:
    branches: [ develop, feature/win-aarch64, main ]
  pull_request:
    branches: [ develop, feature/win-aarch64, main ]
  workflow_dispatch:  # Run manually from Actions tab → "Windows arm64" → "Run workflow"

env:
  FPC_VERSION: "3.3.1"
  LLVM_MINGW_RELEASE: "20251216"
  LLVM_MINGW_ARCHIVE: "llvm-mingw-20251216-ucrt-ubuntu-22.04-x86_64.tar.xz"

jobs:
  crossbuild:
    name: Cross-build (Linux → aarch64-win64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and host FPC
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fpc
          which make
          make -v
          fpc -iV
          echo "PATH=$PATH"

      - name: Cache llvm-mingw
        id: cache_llvm
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm-mingw
          key: llvm-mingw-${{ env.LLVM_MINGW_RELEASE }}-ubuntu-22.04

      - name: Set llvm-mingw env
        run: |
          echo "LLVM_MINGW=$RUNNER_TEMP/llvm-mingw" >> $GITHUB_ENV
          echo "$RUNNER_TEMP/llvm-mingw/bin" >> $GITHUB_PATH

      - name: Install llvm-mingw
        if: steps.cache_llvm.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/llvm-mingw"
          curl -sL "https://github.com/mstorsjo/llvm-mingw/releases/download/${{ env.LLVM_MINGW_RELEASE }}/${{ env.LLVM_MINGW_ARCHIVE }}" -o "$RUNNER_TEMP/llvm-mingw.tar.xz"
          tar -xf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP/llvm-mingw" --strip-components=1
          "$RUNNER_TEMP/llvm-mingw/bin/aarch64-w64-mingw32-clang" --version

      # Restore only; save step at end of job with if: success() so we never save incomplete cache.
      - name: Restore FPC cross-build cache (ppcrossa64 + aarch64-win64 units + ppca64)
        id: cache_fpc
        uses: actions/cache/restore@v4
        with:
          path: |
            compiler/ppcrossa64
            compiler/ppca64
            ${{ runner.temp }}/fpc_install
          key: fpc-aarch64-win64-${{ runner.os }}-${{ hashFiles('compiler/**', 'rtl/**', 'packages/**', 'Makefile', 'Makefile.fpc') }}-v9

      - name: Verify FPC cache contents (when cache hit)
        if: steps.cache_fpc.outputs.cache-hit == 'true'
        run: |
          missing=""
          [ -f "$GITHUB_WORKSPACE/compiler/ppcrossa64" ] || missing="$missing compiler/ppcrossa64"
          [ -f "$GITHUB_WORKSPACE/compiler/ppca64" ] || missing="$missing compiler/ppca64"
          [ -d "$RUNNER_TEMP/fpc_install/lib/fpc/${{ env.FPC_VERSION }}/units/aarch64-win64" ] || missing="$missing fpc_install/.../units/aarch64-win64"
          if [ -n "$missing" ]; then
            echo "::error::FPC cache incomplete (missing:$missing). Bump cache key suffix (-v8 -> -v9) in the workflow to force a fresh build."
            exit 1
          fi
          echo "FPC cache OK: ppcrossa64, ppca64, fpc_install present."

      - name: Cross-install FPC aarch64-win64
        id: crossinstall
        if: steps.cache_fpc.outputs.cache-hit != 'true'
        run: |
          which make || true
          make crossinstall -j4 \
            CPU_TARGET=aarch64 \
            OS_TARGET=win64 \
            FPC=/usr/bin/fpc \
            BINUTILSPREFIX=aarch64-w64-mingw32- \
            CROSSOPT="-FD$RUNNER_TEMP/llvm-mingw/bin -dFPC_DEBUG_WIN64_UNWIND" \
            INSTALL_PREFIX="$RUNNER_TEMP/fpc_install" \
            2>&1 | tee "$RUNNER_TEMP/crossinstall.log"
          exit "${PIPESTATUS[0]}"
        env:
          PATH: "/usr/bin:/usr/local/bin:$RUNNER_TEMP/llvm-mingw/bin:$PATH"

      - name: Show crossinstall log on failure
        if: failure() && steps.cache_fpc.outputs.cache-hit != 'true'
        run: |
          echo "::group::Last 120 lines of crossinstall log"
          tail -120 "$RUNNER_TEMP/crossinstall.log" || true
          echo "::endgroup::"

      - name: Upload crossinstall log on failure
        if: failure() && steps.cache_fpc.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: crossinstall-log
          path: ${{ runner.temp }}/crossinstall.log
          retention-days: 7
          if-no-files-found: ignore

      # FPC install puts cross-compiler in INSTALL_BINDIR/$(SOURCESUFFIX), e.g. fpc_install/bin/x86_64-linux/ppcrossa64.
      # Find it anywhere under fpc_install and copy to compiler/ so Phase 2 compile and cache find it.
      - name: Ensure ppcrossa64 at compiler/ for Phase 2 compile
        if: steps.cache_fpc.outputs.cache-hit != 'true'
        run: |
          D="$GITHUB_WORKSPACE"
          INST="$RUNNER_TEMP/fpc_install"
          FOUND=""
          if [ -f "$D/compiler/ppcrossa64" ]; then
            FOUND="$D/compiler/ppcrossa64"
          else
            FOUND=$(find "$INST" -name ppcrossa64 -type f 2>/dev/null | head -1)
            if [ -n "$FOUND" ] && [ -f "$FOUND" ]; then
              cp "$FOUND" "$D/compiler/ppcrossa64"
              chmod +x "$D/compiler/ppcrossa64"
              echo "Copied ppcrossa64 from $FOUND to compiler/"
            else
              echo "::warning::ppcrossa64 not found under $INST (crossinstall may have failed)"
            fi
          fi
          [ -n "$FOUND" ] && echo "ppcrossa64 at: $FOUND"

      # If sysutils.pp(659) fails with "Unknown compilerproc _fpc_local_unwind", system.ppu
      # did not export the symbol. This step checks whether system.ppu contains it (when cache missed).
      - name: Diagnose system.ppu for _fpc_local_unwind (sysutils.pp:659)
        if: steps.cache_fpc.outputs.cache-hit != 'true'
        run: |
          INST="$RUNNER_TEMP/fpc_install"
          UP="$INST/lib/fpc/${{ env.FPC_VERSION }}/units/aarch64-win64"
          SPPU="$UP/rtl/system.ppu"
          echo "::group::system.ppu compilerproc symbols (grep _fpc_)"
          if [ -f "$SPPU" ]; then
            strings "$SPPU" | grep -i '_fpc_' || true
            if strings "$SPPU" | grep -q '_fpc_local_unwind'; then
              echo "OK: system.ppu contains _fpc_local_unwind (sysutils.pp try...finally+exit will resolve)"
            else
              echo "::warning::system.ppu does NOT contain _fpc_local_unwind - sysutils.pp(659) will fail with Unknown compilerproc. Ensure rtl/win64/seh64.inc exports it (var init + init block)."
            fi
          else
            echo "system.ppu not found at $SPPU (crossinstall may have failed before RTL install)"
          fi
          echo "::endgroup::"
          echo "::group::sysutils.pp context (line 659 = exit in try...finally)"
          sed -n '655,665p' rtl/win/sysutils.pp 2>/dev/null || true
          echo "::endgroup::"

      - name: Compile Phase 2 tests
        run: |
          set -e
          D="$GITHUB_WORKSPACE"
          INST="$RUNNER_TEMP/fpc_install"
          UP="$INST/lib/fpc/${{ env.FPC_VERSION }}/units/aarch64-win64"
          PPC=""
          if [ -f "$D/compiler/ppcrossa64" ]; then
            PPC="$D/compiler/ppcrossa64"
          else
            PPC=$(find "$INST" -name ppcrossa64 -type f 2>/dev/null | head -1)
          fi
          if [ -z "$PPC" ] || [ ! -f "$PPC" ]; then
            echo "::error::ppcrossa64 not found in compiler/ or under fpc_install (FPC installs to bin/SOURCESUFFIX/, e.g. bin/x86_64-linux/)"
            exit 1
          fi
          if [ ! -d "$UP" ]; then
            echo "::error::RTL units dir missing: $UP (crossinstall may have failed)"
            exit 1
          fi
          export PATH="$RUNNER_TEMP/llvm-mingw/bin:$PATH"
          "$PPC" -Twin64 -XPaarch64-w64-mingw32- \
            -Fu"$UP/rtl" -Fu"$UP/rtl-objpas" \
            -FE"$GITHUB_WORKSPACE/tests/phase2-tests" \
            -FD"$RUNNER_TEMP/llvm-mingw/bin" \
            -o"$GITHUB_WORKSPACE/tests/phase2-tests/hello.exe" \
            tests/phase2-tests/hello.pas
          "$PPC" -Twin64 -XPaarch64-w64-mingw32- \
            -Fu"$UP/rtl" -Fu"$UP/rtl-objpas" \
            -FE"$GITHUB_WORKSPACE/tests/phase2-tests" \
            -FD"$RUNNER_TEMP/llvm-mingw/bin" \
            -o"$GITHUB_WORKSPACE/tests/phase2-tests/trap.exe" \
            tests/phase2-tests/trap.pas
          # Bounty Boss: compile from P2 so .s is written there (fix and no-fix)
          P2="$GITHUB_WORKSPACE/tests/phase2-tests"
          cd "$P2"
          # With fix (default) – emits call to _FPC_local_unwind
          "$PPC" -Twin64 -XPaarch64-w64-mingw32- \
            -Fu"$UP/rtl" -Fu"$UP/rtl-objpas" \
            -FE. -FD"$RUNNER_TEMP/llvm-mingw/bin" \
            -a -oarm64trap.exe arm64trap.pas
          # Without fix – plain branch to finally
          "$PPC" -Twin64 -XPaarch64-w64-mingw32- -dFPC_NO_WIN64_LOCAL_UNWIND \
            -Fu"$UP/rtl" -Fu"$UP/rtl-objpas" \
            -FE. -FD"$RUNNER_TEMP/llvm-mingw/bin" \
            -a -oarm64trap_no_fix.exe arm64trap.pas
          cd "$GITHUB_WORKSPACE"
          if [ -f tests/phase2-tests/neontest.pas ]; then
            "$PPC" -Twin64 -XPaarch64-w64-mingw32- \
              -Fu"$UP/rtl" -Fu"$UP/rtl-objpas" \
              -FE"$GITHUB_WORKSPACE/tests/phase2-tests" \
              -FD"$RUNNER_TEMP/llvm-mingw/bin" \
              -o"$GITHUB_WORKSPACE/tests/phase2-tests/neontest.exe" \
              tests/phase2-tests/neontest.pas
          else
            echo "neontest.pas not in repo, skipping NEON compile"
          fi

      - name: Cache msgtxt.inc / msgidx.inc (host-generated, skip rebuild when msg files unchanged)
        id: cache_msgtxt
        uses: actions/cache@v4
        with:
          path: |
            compiler/msgtxt.inc
            compiler/msgidx.inc
          key: msgtxt-${{ runner.os }}-${{ hashFiles('compiler/msg/error*.msg') }}

      - name: Report cache status (llvm-mingw, FPC cross-build, msgtxt)
        run: |
          echo "cache_llvm=${{ steps.cache_llvm.outputs.cache-hit }}"
          echo "cache_fpc=${{ steps.cache_fpc.outputs.cache-hit }}"
          echo "cache_msgtxt=${{ steps.cache_msgtxt.outputs.cache-hit }}"
          echo "Cache hits above = skip download/build for those steps."

      # When building ppca64 (FPC cache miss), we must have msgtxt.inc. Relying on
      # msgtxt cache restore can still lead to make trying to build/run msg2inc.exe.
      # So always generate with host FPC whenever we will run "Build native ppca64".
      - name: Generate msgtxt.inc with host FPC (Phase 3)
        if: steps.cache_fpc.outputs.cache-hit != 'true'
        run: |
          # msg2inc must run on the runner (Linux); make compiler uses FPC=ppcrossa64
          # which would build a Windows msg2inc.exe and then try to run it -> fail.
          # Pre-generate msgtxt.inc with host fpc so "make compiler" skips msg2inc.
          make -C compiler msgtxt.inc FPC=/usr/bin/fpc
        env:
          PATH: "/usr/bin:/usr/local/bin:$PATH"

      - name: Build native ppca64 (Phase 3)
        if: steps.cache_fpc.outputs.cache-hit != 'true'
        run: |
          D="$GITHUB_WORKSPACE"
          UP="$RUNNER_TEMP/fpc_install/lib/fpc/${{ env.FPC_VERSION }}/units/aarch64-win64"
          make -C compiler compiler -j4 \
            FPC="$D/compiler/ppcrossa64" \
            OS_TARGET=win64 \
            CPU_TARGET=aarch64 \
            BINUTILSPREFIX=aarch64-w64-mingw32- \
            OPT="-FD$RUNNER_TEMP/llvm-mingw/bin -Fu$UP/rtl -Fu$UP/rtl-objpas"
          # Ensure canonical location for cache and staging (make may put it in compiler/ or aarch64/bin/...)
          for cand in "$D/compiler/ppca64" "$D/compiler/aarch64/bin/aarch64-win64/ppca64" "$D/ppca64"; do
            if [ -f "$cand" ]; then
              if [ "$cand" != "$D/compiler/ppca64" ]; then cp "$cand" "$D/compiler/ppca64"; fi
              break
            fi
          done
        env:
          PATH: "/usr/bin:/usr/local/bin:$RUNNER_TEMP/llvm-mingw/bin:$PATH"

      # Paths: compile writes to $GITHUB_WORKSPACE/tests/phase2-tests/{hello,trap,arm64trap,neontest}.exe;
      # ppca64 is at $GITHUB_WORKSPACE/compiler/ppca64 (or compiler/aarch64/bin/aarch64-win64/).
      # We stage into arm64-exes/ and upload that dir; download extracts to workspace.
      - name: Verify assembly patterns (Bounty Boss fix vs no-fix)
        run: |
          D="$GITHUB_WORKSPACE/tests/phase2-tests"
          echo "::group::Assembly: fix version (arm64trap.s) – expect call to _FPC_local_unwind"
          if [ -f "$D/arm64trap.s" ]; then
            if grep -q '_FPC_local_unwind\|_FPC_LOCAL_UNWIND' "$D/arm64trap.s"; then
              echo "OK: arm64trap.s contains _FPC_local_unwind (fix was compiled in)"
              grep -n '_FPC_local_unwind\|_FPC_LOCAL_UNWIND\|bl.*local_unwind' "$D/arm64trap.s" || true
            else
              echo "::warning::arm64trap.s does NOT contain _FPC_local_unwind (fix may not be active)"
            fi
          else
            echo "::warning::arm64trap.s not found"
          fi
          echo "::endgroup::"
          echo "::group::Assembly: no-fix version (arm64trap_no_fix.s) – expect NO _FPC_local_unwind"
          if [ -f "$D/arm64trap_no_fix.s" ]; then
            if grep -q '_FPC_local_unwind\|_FPC_LOCAL_UNWIND' "$D/arm64trap_no_fix.s"; then
              echo "::warning::arm64trap_no_fix.s contains _FPC_local_unwind (expected plain branch only)"
            else
              echo "OK: arm64trap_no_fix.s has no _FPC_local_unwind (no-fix version as expected)"
            fi
          else
            echo "::warning::arm64trap_no_fix.s not found"
          fi
          echo "::endgroup::"

      # Static analysis on Linux: disassemble and dump unwind so we can inspect without Windows.
      - name: Disassemble and dump unwind (static analysis on Linux)
        run: |
          D="$GITHUB_WORKSPACE/tests/phase2-tests"
          STAGE="$GITHUB_WORKSPACE/arm64-exes"
          PATH="$RUNNER_TEMP/llvm-mingw/bin:$PATH"
          OBJDUMP=""
          for cand in aarch64-w64-mingw32-objdump llvm-objdump; do
            if command -v "$cand" >/dev/null 2>&1; then OBJDUMP="$cand"; break; fi
          done
          if [ -z "$OBJDUMP" ]; then
            echo "::warning::No objdump found (aarch64-w64-mingw32-objdump or llvm-objdump); static analysis skipped"
            exit 0
          fi
          mkdir -p "$STAGE"
          for exe in arm64trap arm64trap_no_fix; do
            if [ ! -f "$D/${exe}.exe" ]; then continue; fi
            echo "::group::Disassembly: ${exe}.exe"
            "$OBJDUMP" -d "$D/${exe}.exe" > "$STAGE/${exe}_disasm.txt" 2>/dev/null || true
            head -200 "$STAGE/${exe}_disasm.txt" || true
            echo "::endgroup::"
            if [ "$OBJDUMP" = "llvm-objdump" ]; then
              echo "::group::Unwind info: ${exe}.exe"
              "$OBJDUMP" -u "$D/${exe}.exe" > "$STAGE/${exe}_unwind.txt" 2>/dev/null || true
              cat "$STAGE/${exe}_unwind.txt" || true
              echo "::endgroup::"
            else
              touch "$STAGE/${exe}_unwind.txt"
              echo "::notice::llvm-objdump not used; unwind dump skipped (use llvm-objdump -u for .pdata/.xdata)"
            fi
          done
          echo "Staged disasm/unwind in $STAGE (in artifact for offline inspection)."

      # Walk disassembly to find "the deed" (try/finally path) without running on Windows (~1s).
      - name: Walk ARM64 PE to deed (static trace)
        run: |
          D="$GITHUB_WORKSPACE/tests/phase2-tests"
          STAGE="$GITHUB_WORKSPACE/arm64-exes"
          for name in arm64trap arm64trap_no_fix; do
            disasm="$STAGE/${name}_disasm.txt"
            if [ ! -f "$disasm" ]; then continue; fi
            echo "::group::Walk $name"
            python3 "$D/walk_arm64_pe.py" --disasm "$disasm" -v 2>&1 || true
            echo "::endgroup::"
          done

      # Extract target address passed to _FPC_local_unwind (compare with runtime target= from CI output).
      - name: Extract unwind target from disasm (Bounty Boss)
        run: |
          D="$GITHUB_WORKSPACE/tests/phase2-tests"
          STAGE="$GITHUB_WORKSPACE/arm64-exes"
          disasm="$STAGE/arm64trap_disasm.txt"
          if [ -f "$disasm" ]; then
            echo "::group::Unwind target (arm64trap)"
            python3 "$D/extract_unwind_target.py" --disasm "$disasm" 2>&1 || true
            echo "Compare 'resolved target' above with runtime 'target=\$...' from FPC_DEBUG_WIN64_UNWIND."
            echo "::endgroup::"
          fi

      - name: List expected exe locations (diagnostic)
        run: |
          D="$GITHUB_WORKSPACE"
          echo "=== tests/phase2-tests ==="
          ls -la "$D/" || true
          echo "=== compiler (ppca64, ppcrossa64) ==="
          ls -la "$D/compiler/ppca64" 2>/dev/null || echo "compiler/ppca64 not found"
          ls -la "$D/compiler/ppcrossa64" 2>/dev/null || echo "compiler/ppcrossa64 not found"
          find "$D/compiler" -maxdepth 4 -name 'ppca64*' -o -name 'ppcrossa64*' 2>/dev/null || true

      - name: Stage and upload arm64 executables and ppca64
        run: |
          set -e
          D="$GITHUB_WORKSPACE"
          STAGE="$D/arm64-exes"
          mkdir -p "$STAGE"
          # Phase 2 test exes (compile writes to tests/phase2-tests/)
          P2="$D/tests/phase2-tests"
          for f in hello trap; do
            if [ -f "$P2/${f}.exe" ]; then cp "$P2/${f}.exe" "$STAGE/"; else echo "Missing: tests/phase2-tests/${f}.exe"; exit 1; fi
          done
          for exe in arm64trap arm64trap_no_fix; do
            if [ -f "$P2/${exe}.exe" ]; then
              cp "$P2/${exe}.exe" "$STAGE/"
            elif [ -f "$P2/${exe}" ]; then
              cp "$P2/${exe}" "$STAGE/${exe}.exe"
            else
              echo "Missing: $exe (expected tests/phase2-tests/${exe}.exe or ${exe})"
              ls -la "$P2/"
              exit 1
            fi
          done
          for asm in arm64trap arm64trap_no_fix; do
            if [ -f "$P2/${asm}.s" ]; then
              cp "$P2/${asm}.s" "$STAGE/"
            else
              echo "::warning::${asm}.s not found (assembly not staged)"
            fi
          done
          if [ -f "$P2/neontest.exe" ]; then
            cp "$P2/neontest.exe" "$STAGE/"
          elif [ -f "$P2/neontest" ]; then
            cp "$P2/neontest" "$STAGE/neontest.exe"
          else
            echo "neontest.exe not built (neontest.pas optional), skipping"
          fi
          # ppca64: make can put it in compiler/, compiler/aarch64/bin/aarch64-win64/, or repo root
          PPC64=""
          for cand in "$D/compiler/ppca64" "$D/compiler/ppca64.exe" \
                      "$D/compiler/aarch64/bin/aarch64-win64/ppca64" \
                      "$D/compiler/aarch64/bin/aarch64-win64/ppca64.exe" \
                      "$D/ppca64" "$D/ppca64.exe"; do
            if [ -f "$cand" ]; then PPC64="$cand"; break; fi
          done
          if [ -z "$PPC64" ]; then
            echo "Missing: ppca64 (searched compiler/, aarch64/bin/aarch64-win64/, repo root)"
            find "$D" -maxdepth 5 -name 'ppca64*' 2>/dev/null || true
            exit 1
          fi
          # Stage as ppca64.exe so Windows runner has a proper .exe (run/exit-code capture works reliably)
          cp "$PPC64" "$STAGE/ppca64.exe"
          echo "Staged in $STAGE:"; ls -la "$STAGE/"

      - name: Upload arm64 executables and ppca64
        uses: actions/upload-artifact@v4
        with:
          name: phase2-arm64-exes
          path: arm64-exes

  test-windows-arm64:
    name: Run on Windows arm64
    runs-on: windows-11-arm
    needs: [ crossbuild ]
    steps:
      - uses: actions/checkout@v4

      # Artifact "phase2-arm64-exes": download extracts to workspace/phase2-arm64-exes/ (artifact name).
      # Upload came from Linux dir arm64-exes/, so contents may be at phase2-arm64-exes/ or phase2-arm64-exes/arm64-exes/.
      - name: Download arm64 executables
        uses: actions/download-artifact@v4
        with:
          name: phase2-arm64-exes
          path: ${{ github.workspace }}

      - name: List artifact contents (sanity check)
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $root = if (Test-Path phase2-arm64-exes) { 'phase2-arm64-exes' } elseif (Test-Path arm64-exes) { 'arm64-exes' } else { '.' }
          $dir = if (Test-Path (Join-Path $root 'arm64-exes')) { (Join-Path $root 'arm64-exes') } else { $root }
          Write-Host "Artifact root: $root; exe dir: $dir"
          Get-ChildItem $dir -ErrorAction SilentlyContinue | Format-Table Name, Length -AutoSize
        shell: pwsh

      - name: Run hello.exe and trap.exe
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $root = if (Test-Path phase2-arm64-exes) { 'phase2-arm64-exes' } elseif (Test-Path arm64-exes) { 'arm64-exes' } else { '.' }
          $dir = if (Test-Path (Join-Path $root 'hello.exe')) { $root } elseif (Test-Path (Join-Path $root 'arm64-exes\hello.exe')) { (Join-Path $root 'arm64-exes') } else { '.' }
          Push-Location $dir
          .\hello.exe
          $out = .\trap.exe 2>&1 | Out-String
          Pop-Location
          if ($out -notmatch 'Caught: The Unwind Trap') {
            Write-Error "Expected 'Caught: The Unwind Trap'. Got: $out"
            exit 1
          }
          Write-Host "OK: $out"
          exit 0
        shell: pwsh

      # Golden proof for bounty: verify trap.exe has valid ARM64 SEH unwind tables (.pdata).
      - name: Verify SEH unwind tables (dumpbin /pdata)
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $root = if (Test-Path phase2-arm64-exes) { 'phase2-arm64-exes' } elseif (Test-Path arm64-exes) { 'arm64-exes' } else { '.' }
          $dir = if (Test-Path (Join-Path $root 'trap.exe')) { $root } else { (Join-Path $root 'arm64-exes') }
          $trapExe = Join-Path $dir 'trap.exe'
          if (-not (Test-Path $trapExe)) { Write-Host "trap.exe not found, skipping dumpbin"; exit 0 }
          $dumpbin = $null
          if (Get-Command dumpbin -ErrorAction SilentlyContinue) { $dumpbin = 'dumpbin' }
          if (-not $dumpbin -and (Test-Path "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe")) {
            $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
            if ($vsPath) {
              $candidates = Get-ChildItem -Path "$vsPath\VC\Tools\MSVC" -Recurse -Filter "dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($candidates) { $dumpbin = $candidates.FullName }
            }
          }
          if (-not $dumpbin) {
            Write-Host "::warning::dumpbin not found; SEH unwind check skipped (install MSVC Build Tools for full check)"
            exit 0
          }
          $out = & $dumpbin /pdata $trapExe 2>&1
          $text = $out | Out-String
          if ($text -match 'Unwind|pdata|exception') {
            Write-Host "Verified: trap.exe contains ARM64 unwind/exception metadata."
          } else {
            Write-Host "dumpbin /pdata output (first 50 lines):"
            ($text -split "`n" | Select-Object -First 50) -join "`n"
            Write-Host "::warning::No obvious unwind pattern in dumpbin output; binary may still be valid."
          }
          exit 0
        shell: pwsh

      - name: Run NEON vector test (SIMD performance validation)
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $root = if (Test-Path phase2-arm64-exes) { 'phase2-arm64-exes' } elseif (Test-Path arm64-exes) { 'arm64-exes' } else { '.' }
          $dir = if (Test-Path (Join-Path $root 'neontest.exe')) { $root } else { (Join-Path $root 'arm64-exes') }
          $exe = Join-Path $dir 'neontest.exe'
          if (-not (Test-Path $exe)) {
            Write-Host "neontest.exe not in artifact (neontest.pas optional), skipping NEON test"
            exit 0
          }
          Push-Location $dir
          $out = .\neontest.exe 2>&1 | Out-String
          Pop-Location
          Write-Host $out
          if ($out -notmatch 'Result: PASS \(SIMD alignment and execution successful\)') {
            Write-Error "NEON test failed: expected 'Result: PASS (SIMD alignment and execution successful)'. Got: $out"
            exit 1
          }
          Write-Host "NEON vector test passed."
          exit 0
        shell: pwsh

      # Bounty Boss: run both fix and no-fix versions so we can compare behaviour.
      - name: Run Bounty Boss test – with fix (arm64trap.exe)
        id: bounty_boss
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $root = if (Test-Path phase2-arm64-exes) { 'phase2-arm64-exes' } elseif (Test-Path arm64-exes) { 'arm64-exes' } else { '.' }
          $dir = if (Test-Path (Join-Path $root 'arm64trap.exe')) { $root } else { (Join-Path $root 'arm64-exes') }
          Push-Location $dir
          Write-Host "=== arm64trap.exe (with fix) ==="
          # Capture stdout+stderr (RTL unwind debug FPC_DEBUG_WIN64_UNWIND goes to stderr)
          $out = .\arm64trap.exe 2>&1 | Out-String
          Pop-Location
          Write-Host $out
          $ok = $false
          if ($out -match 'Success: Finally block executed!') {
            if ($out -notmatch 'Done\.') {
              Write-Host "Warning: 'Done.' not in output (exit-path crash). Check DEBUG: 'After finally block in TestException' = transfer/epilogue; 'Back in main' = return from TestException; 'After Flush' = in Flush."
            } else {
              Write-Host "Bounty Boss (fix): passed (finally + Done.)."
              $ok = $true
            }
          } else {
            Write-Host "Bounty Boss (fix) failed: expected 'Success: Finally block executed!'. Got: $out"
          }
          echo "bounty_boss_ok=$ok" >> $env:GITHUB_OUTPUT
          exit 0
        shell: pwsh

      - name: Run Bounty Boss test – no fix (arm64trap_no_fix.exe) [informational]
        id: bounty_boss_no_fix
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $root = if (Test-Path phase2-arm64-exes) { 'phase2-arm64-exes' } elseif (Test-Path arm64-exes) { 'arm64-exes' } else { '.' }
          $dir = if (Test-Path (Join-Path $root 'arm64trap_no_fix.exe')) { $root } else { (Join-Path $root 'arm64-exes') }
          Push-Location $dir
          Write-Host "=== arm64trap_no_fix.exe (no fix) [expected: no finally, prints Done] ==="
          $out = .\arm64trap_no_fix.exe 2>&1 | Out-String
          Pop-Location
          Write-Host $out
          if ($out -match 'Success: Finally block executed!') { Write-Host "Bounty Boss (no-fix): unexpectedly ran finally." } else { Write-Host "Bounty Boss (no-fix): as expected, did not run finally (skips to Done)." }
          exit 0
        shell: pwsh

      # ppca64 (Phase 3 native compiler) – skipped for now: gets stuck when run on Windows ARM64.
      # We will come back to this; build/stage still happens in crossbuild job for future use.

      # Fail the job only if Bounty Boss (fix) failed. Fix must show finally + Done. No-fix is informational only.
      - name: Fail if Bounty Boss (fix) failed
        run: |
          $boss = "${{ steps.bounty_boss.outputs.bounty_boss_ok }}"
          Write-Host "Bounty Boss (fix) ok: $boss"
          if ($boss -ne 'true') {
            Write-Error "Bounty Boss (fix) failed: expected 'Success: Finally block executed!' and 'Done.' in output. See logs and DEBUG lines (After finally block / Back in main / After Flush) to narrow crash."
            exit 1
          }
          Write-Host "Bounty Boss (fix) passed."
        shell: pwsh
